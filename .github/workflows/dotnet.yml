name: ASP .NET Core CI

# Trigger condition
on:
  push:
    branches: ["master", "main"] # When push to these 2 branches
  pull_request:
    branches: ["master", "main"] # Or pull request on these 2 branches

jobs:
  build:
    # Run on latest ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Download on the vm
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # Ensure installing version 10

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build solution
      # --no-restore because restored before
      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # 5. Run all tests in the solution
      - name: Run all tests
        run: dotnet test --no-build --configuration Release --verbosity normal
